{% extends "base.html" %}
{% block content %}

<div class="card">
    <h2>Firewall Packet Simulation</h2>

    <form method="POST" class="form-grid">
        <input name="src_ip" placeholder="Source IP" required>
        <input name="dst_ip" placeholder="Destination IP" required>
        <input name="dst_port" placeholder="Port" type="number" required>
        <select name="protocol">
            <option value="TCP">TCP</option>
            <option value="UDP">UDP</option>
        </select>
        <button type="submit">Simulate Packet</button>
    </form>

    {% if decision %}
    <p style="margin-top:20px;">
        Decision:
        <span class="badge-{{ decision|lower }}">{{ decision }}</span>
    </p>
    {% endif %}
</div>

{% endblock %}
